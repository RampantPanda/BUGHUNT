# Keep clipboard content after app closes
exec-once = wl-clip-persist --clipboard regular --reconnect-tries 0 &

# watch idle
exec-once = ~/.config/mango/swayidle.sh

# bar
exec-once = waybar

#notification daemon, handle this with systemctl instead
#exec-once = swaync 

# eww
exec-once = eww daemon
exec=eww open sysmon

