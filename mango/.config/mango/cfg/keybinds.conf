# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

# Your favorite applications.
bind = SUPER, Return, spawn, kitty
bind = ALT, Return, spawn, alacritty # for VMs
bind = SUPER, e, spawn, thunar
bind = SUPER, b, spawn, firefox
bind = SUPER, w, spawn, waybar
bind = ALT, h, spawn, $HOME/.config/waybar/cheatsheet.sh

# Please choose the text editor of your choice.
bind = SUPER, x, spawn, geany

bind = SUPER, q, killclient
bind = ALT, q, killclient

# Launchers and screenshots
bind = SUPER,space,spawn,tofi-drun
bind = ALT,t,spawn,tofi-drun
bind = ALT,f,spawn,fuzzel
bind = CTRL,PRINT,spawn_shell,sh -c 'grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png" && notify-send "SCREEN CAPTURE","Screen region save complete"'
bind = NONE,PRINT,spawn_shell, sh -c 'grim "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png" & notify-send "SCREEN CAPTURE","Screen capture save complete"'

# Reload mango config
bind = ALT, r, reload_config
bind = SUPER,r,reload_config

# Audio, mango
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# Brightness, mango
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%

# Switch window focus
bind = ALT, Tab, focusstack, next
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down

# Swap window
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right

# Switch window status
bind = SUPER, g, toggleglobal,
bind = SUPER, Tab, toggleoverview,
bind = SUPER, f, togglefloating,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
#bind = SUPER, i, minimized,
bind = SUPER, o, toggleoverlay,
#bind = SUPER+SHIFT, I, restore_minimized
bind = SUPER, z, toggle_scratchpad

# Scroller layout
bind = SUPER+SHIFT, x, set_proportion, 1.0
bind = SUPER, x, switch_proportion_preset,

# Switch layout
bind = SUPER+SHIFT, n, switch_layout

# set layout
bind = SUPER+SHIFT, t, setlayout,tile
bind = SUPER+SHIFT, s, setlayout,scroller
bind = SUPER+SHIFT, c, setlayout,center_tile


# show notifications
bind=SUPER, n, spawn, swaync-client -t

# Switch between workspaces
bind = ALT, 1, view, 1, 0
bind = ALT, 2, view, 2, 0
bind = ALT, 3, view, 3, 0
bind = ALT, 4, view, 4, 0
bind = ALT, 5, view, 5, 0
bind = ALT, 6, view, 6, 0
bind = ALT, 7, view, 7, 0
bind = ALT, 8, view, 8, 0
bind = ALT, 9, view, 9, 0

# Tag: move client to another workspace.
# Tagsilent: move client to another workspace but do not focus it.
# E.g bind = SUPER+SHIFT, 1, tagsilent, 1
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# Switch between monitors
#bind = SUPER+ALT, Left, focusmon, left
#bind = SUPER+ALT, Right, focusmon, right
# Move window to another monitor
#bind = SUPER+ALT, Left, tagmon, left
#bind = SUPER+ALT, Right, tagmon, right

# Gaps
bind = SUPER+SHIFT, X, incgaps, 1
bind = SUPER+SHIFT, Z, incgaps, -1
bind = SUPER+SHIFT, R, togglegaps

# Movewin
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50,+0
bind = CTRL+SHIFT, Right, movewin, +50,+0

# Resizewin
bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# Mouse Button Bindings.
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = NONE, btn_middle, togglemaximizescreen, 0
mousebind = SUPER, btn_right, moveresize, curresize

# Lock screen
bind=ALT,l,spawn_shell,sh -c '~/.config/gtklock/lock.sh'
bind=SUPER,l,spawn,spawn_shell,sh -c '~/.config/gtklock/lock.sh'

# GTFO
bind=ALT,o,spawn,wlogout

# swipe swipe
gesturebind=none,left,3,viewtoright,0
gesturebind=none,right,3,viewtoleft,0
gesturebind=none,up,4,toggleoverview,0

# in case of shit
keymode = common
bind = CTRL,ALT,Return,spawn,ghostty

