# | Rules |
# Window/Tag/Layer rules. | https://mangowm.github.io/docs/window-management/rules

window_rule = is_floating:1, app_id:[Ss]team
window_rule = is_floating:0, title:Steam
window_rule = is_floating:1, app_id:steam, title:Steam Settings

layer_rule = no_animation:1, no_blur:1, layer_name:selection

window_rule=is_floating:1,is_overlay:1,width:760,height:800,offset_x:95,offset_y:-90,app_id:^nmtui$ ## This makes nm-tui open next to network module in waybar
window_rule=is_floating:1,is_overlay:1,width:760,height:800,offset_x:95,offset_y:-90,app_id:^blueman-manager$ ## This makes blueman open next to bluetooth module in waybar
window_rule=is_floating:1,width:860,height:1200,offset_x:5,offset_y:-5,title:MANGOKEYBINDREFERENCE ## cheatsheet
