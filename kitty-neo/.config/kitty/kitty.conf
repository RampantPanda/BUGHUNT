# ═══════════════════════════════════════════════════════
# K / KITTY
# ═══════════════════════════════════════════════════════

# make kitty open fish
shell fish

# keys
map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0

# stfu
enable_audio_bell no

# Font
font_family             SpaceMono Nerd Font Mono
bold_font               auto
italic_font             auto
bold_italic_font        auto
font_size               20.0

# Window
window_padding_width    8
confirm_os_window_close 0

# Base colors
background              #0e0402
foreground              #75e3ee

# Cursor
cursor                  #75e3ee
cursor_text_color       #0e0402
cursor_shape            block
cursor_blink_interval   0.5

# Selection
selection_background    #75e3ee
selection_foreground    #0e0402

# ANSI normal
color0                  #0e0402
color1                  #fd9e38
color2                  #166c47
color3                  #fd9e38
color4                  #75e3ee
color5                  #c2d7c7
color6                  #75e3ee
color7                  #c2d7c7

# ANSI bright
color8                  #2d7b4a
color9                  #fd9e38
color10                 #2d7b4a
color11                 #fd9e38
color12                 #75e3ee
color13                 #c2d7c7
color14                 #75e3ee
color15                 #c2d7c7
