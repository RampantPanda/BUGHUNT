"$schema" = 'https://starship.rs/config-schema.json'

# Expanse-inspired telemetry: ice / cyan / muted teal, amber for attention.
# Transparent background; no patched font required for the core prompt.
palette = 'expanse'
add_newline = true

# $all keeps contextual modules without duplicating those placed explicitly.
# Keep the input line short, even with several active project runtimes.
format = """
[╭─](frame) \
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$all\
$cmd_duration\
$line_break\
[╰─](frame) \
$sudo\
$jobs\
$status\
$character"""

[palettes.expanse]
ice = '#c7f5ff'
cyan = '#75e3ee'
teal = '#82b8c1'
frame = '#42747e'
amber = '#ffb454'
red = '#ff637a'
# Keep uncustomized contextual modules in the same cool spectrum.
blue = '#75e3ee'
green = '#82b8c1'
purple = '#a4dce7'
yellow = '#82b8c1'
white = '#c7f5ff'

# Identity appears for SSH, root, or a user different from the login user.
[username]
show_always = false
style_user = 'bold ice'
style_root = 'bold amber'
format = '[$user]($style) '

[hostname]
ssh_only = true
ssh_symbol = 'ssh '
style = 'bold teal'
format = '[$ssh_symbol$hostname]($style) '

[directory]
style = 'bold cyan'
format = '[$path]($style)( [$read_only]($read_only_style)) '
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
home_symbol = '~'
read_only = 'RO'
read_only_style = 'bold amber'

[git_branch]
symbol = '⎇ '
style = 'teal'
format = '[$symbol$branch(:$remote_branch)]($style) '
truncation_length = 24
truncation_symbol = '…'
only_attached = true

[git_commit]
only_detached = true
commit_hash_length = 7
style = 'teal'
format = '[⎇ @$hash]($style) '

[git_state]
style = 'bold amber'
format = '[\[$state( $progress_current/$progress_total)\]]($style) '

# A clean repository needs only its branch; changes carry compact counts.
[git_status]
style = 'amber'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '=$count'
stashed = '*$count'
deleted = '-$count'
renamed = '»$count'
modified = '~$count'
staged = '+$count'
untracked = '?$count'
ahead = '↑$count'
behind = '↓$count'
diverged = '↑$ahead_count↓$behind_count'
up_to_date = ''

# Short labels keep common runtimes legible without a Nerd Font.
[nodejs]
symbol = 'node '
style = 'teal'
format = '[$symbol($version)]($style) '

[bun]
symbol = 'bun '
style = 'teal'
format = '[$symbol($version)]($style) '

[deno]
symbol = 'deno '
style = 'teal'
format = '[$symbol($version)]($style) '

[python]
symbol = 'py '
style = 'teal'
format = '[$symbol$version( · $virtualenv)]($style) '

[rust]
symbol = 'rs '
style = 'teal'
format = '[$symbol($version)]($style) '

[golang]
symbol = 'go '
style = 'teal'
format = '[$symbol($version)]($style) '

[c]
symbol = 'c '
style = 'teal'
format = '[$symbol($version)]($style) '

[java]
symbol = 'java '
style = 'teal'
format = '[$symbol($version)]($style) '

[docker_context]
symbol = 'docker '
style = 'teal'
format = '[$symbol$context]($style) '

[container]
symbol = 'ctr '
style = 'teal'
format = '[$symbol$name]($style) '

[nix_shell]
symbol = 'nix '
style = 'teal'
format = '[$symbol$state( · $name)]($style) '

[conda]
symbol = 'conda '
style = 'teal'
format = '[$symbol$environment]($style) '
ignore_base = true

[package]
disabled = true

# Elapsed time only for commands taking at least two seconds.
[cmd_duration]
min_time = 2000
style = 'teal'
format = '[· $duration]($style) '

# Native cached-credentials indicator; never prompts for a password.
[sudo]
disabled = false
symbol = 'SUDO'
style = 'bold amber'
format = '[\[$symbol\]]($style) '

[jobs]
symbol = '&'
style = 'teal'
number_threshold = 1
symbol_threshold = 1
format = '[$symbol$number]($style) '

[status]
disabled = false
style = 'bold amber'
format = '[exit $status]($style) '
pipestatus = true
pipestatus_format = '[exit \[$pipestatus\]]($style) '
pipestatus_segment_format = '$status'
pipestatus_separator = '|'

[battery]
format = '[bat $percentage]($style) '

[[battery.display]]
threshold = 15
style = 'bold amber'

[time]
disabled = true

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold cyan)'
error_symbol = '[❯](bold amber)'
vimcmd_symbol = '[❮](bold ice)'
vimcmd_replace_one_symbol = '[R](bold amber)'
vimcmd_replace_symbol = '[R](bold amber)'
vimcmd_visual_symbol = '[V](bold ice)'
