"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg:transparent fg:color_primary)\
$username\
([](bg:color_secondary fg:color_primary)$hostname[](bg:color_primary fg:color_secondary))\
$directory\
[](bg:color_secondary fg:color_primary)\
$git_status\
[](bg:transparent fg:color_secondary)\
$character"""

palette = 'bughunt_dark'

[palettes.bughunt_dark]
color_primary = '#75e3ee'
color_surface = '#0e0402'
color_secondary = '#2d7b4a'
color_alert = '#fd9e38'
color_superior = '#b8f7ff'
color_green = '#39ff88'
color_text = '#e6faff'
color_orange = '#ff8a3d'
color_purple = '#d66bff'
color_red = '#ff3d71'
color_yellow = '#f5ff65'

# ~/.config/starship.toml

[hostname]
ssh_only = true
format = "[@$hostname ](fg:color_primary bg:color_secondary)"
disabled = false

[username]
show_always = false
style_user = "fg:color_surface bg:color_primary"
style_root = "fg:color_surface bg:color_primary"
format = '[ $user]($style)'

[directory]
style = "fg:color_surface bg:color_primary"
format = "[ $path ]($style)"
truncation_length = 6
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:color_primary"
format = '[[ $symbol $branch $untracked $modified ](fg:color_primary bg:transparent)]($style)'

[git_status]
style = "fg:color_text bg:color_secondary"
format = '[ GIT $untracked $modified $up_to_date ]($style)'
untracked ="<>"
modified = "<>"
up_to_date = "<>"

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[$time](fg:color_superior bg:color_secondary)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_primary)'
error_symbol = '[×](bold fg:color_alert)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
