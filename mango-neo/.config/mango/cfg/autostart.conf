# | Auto Start |
# autostart your favorite applications here
# Keep clipboard content after app closes
exec_once = wl-clip-persist --clipboard regular --reconnect-tries 0 
# polkit polkit polkit
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# watch idle
exec_once = ~/.config/mango/swayidle.sh

# bar
exec_once = /usr/bin/python3 ~/.config/waybar/launch.py --width-percent 70

#notification daemon, disabled because systemd handles it
#exec-once = swaync 

exec_once = swaybg -c 0e0402

# Eww
exec_once = eww daemon
exec_once = eww open sysmon
exec_once = eww open logowindow
