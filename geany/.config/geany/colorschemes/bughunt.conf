fold_symbol_highlight=primary
indent_guide=secondary
caret=superior;superior;false
marker_line=bright_text;primary;false;false
marker_search=surface;superior;false;false
marker_mark=bright_text;secondary;false;false
call_tips=text;surface_alt;false;false
white_space=secondary;;true;false

# Programming languages
comment=dim;surface;false;true
comment_doc=soft_text;surface;false;true
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword=comment_doc,bold
comment_doc_keyword_error=bright_red;surface;true;true
number=bright_green
number_1=number
number_2=green
number_3=bright_green
type=bright_blue;;true;false
class=type
function=bright_magenta
parameter=soft_text
annotation=superior
keyword=bright_yellow;;true;false
keyword_1=keyword
keyword_2=superior;;true;false
keyword_3=keyword_1
keyword_4=keyword_1
identifier=default
identifier_1=identifier
identifier_2=soft_text
identifier_3=bright_cyan
identifier_4=identifier_1
string=green
string_1=string
string_2=bright_green
string_3=string
string_4=string
