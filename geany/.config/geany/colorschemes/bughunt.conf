# BUGHUNT color scheme for Geany
# Generated from the BUGHUNT master palette.

[theme_info]
name=BUGHUNT
description=Dirty amber/brown BUGHUNT theme with restrained syntax colors.
version=1

[named_colors]
surface=#1d170b
surface_alt=#251f0d
surface_alt2=#2a230f
secondary=#3b3000
primary=#756000
superior=#9c8000
alert=#752300
text=#c7bd94
soft_text=#b8ae89
bright_text=#e1d8b4
dim=#665d45
red=#a63c2d
green=#71935a
yellow=#9c8000
blue=#527f8f
magenta=#8b6577
cyan=#57958d
bright_red=#d05a43
bright_green=#9dbb72
bright_yellow=#c5a629
bright_blue=#78a9b7
bright_magenta=#b88ba0
bright_cyan=#7dbdb2

[named_styles]
default=text;surface;false;false
error=bright_text;alert;true;false

# Editor
selection=bright_text;secondary;false;true
current_line=;surface_alt;true;false
brace_good=surface;superior;true;false
brace_bad=bright_text;alert;true;false
margin_line_number=dim;surface_alt;false;false
