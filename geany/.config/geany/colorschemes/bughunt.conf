# Markup
tag=bright_yellow;;true;false
tag_unknown=bright_red
tag_end=yellow
attribute=bright_magenta
attribute_unknown=red
value=green
entity=bright_cyan

# Diff
line_added=bright_green;surface;false;false
line_removed=bright_red;surface;false;false
line_changed=bright_yellow;surface;false;false
