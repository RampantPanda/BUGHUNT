# BUGHUNT — Hyprlock

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(050605)
}

# SYSTEM STATUS
label {
    monitor =
    text = cmd[update:1000] bash ~/.config/hypr/status.sh
    font_family = SpaceMono Nerd Font Mono
    font_size = 18
    color = rgb(d2b45b)
    text_align = left
    position = 0, 170
    halign = center
    valign = center
}

# PASSWORD
input-field {
    monitor =
    size = 400, 48
    outline_thickness = 2
    outer_color = rgb(727761)
    inner_color = rgb(050605)
    font_color = rgb(d2b45b)

    font_family = SpaceMono Nerd Font Mono
    dots_center = false
    rounding = 0
    placeholder_text = AUTHORIZATION REQUIRED

    position = 0, -170
    halign = center
    valign = center
}
