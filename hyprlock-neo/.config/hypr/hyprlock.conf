# BUGHUNT-NEO — Hyprlock

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(101820)
}

# SYSTEM STATUS
label {
    monitor =
    text = cmd[update:1000] bash ~/.config/hypr/status.sh
    font_family = SpaceMono Nerd Font Mono
    font_size = 18
    color = rgb(a5e9ed)
    text_align = left
    position = 0, 170
    halign = center
    valign = center
}

# PASSWORD
input-field {
    monitor =
    size = 400, 48
    outline_thickness = 2
    outer_color = rgb(00d9e9)
    inner_color = rgb(101820)
    font_color = rgb(a5e9ed)

    font_family = SpaceMono Nerd Font Mono
    dots_center = false
    rounding = 0
    placeholder_text = AUTHORIZATION REQUIRED

    position = 0, -170
    halign = center
    valign = center
}
